name: ClauAC
version: '${version}'
main: io.github.hellotta.clauac.ClauACPlugin
description: '${description}'
api-version: '${apiVersion}'
author: HELLOtta
website: https://github.com/HELLOtta/ClauAC
# - PacketEvents injects into the network pipeline after these plugins, so they have to load first when present -
softdepend:
  - ProtocolLib
  - ProtocolSupport
  - ViaVersion
  - ViaBackwards
  - ViaRewind
  - Geyser-Spigot
commands:
  clauac:
    description: Shows what the simulation found and turns alerts on or off
    usage: /clauac <alerts|debug|reload|status>
permissions:
  clauac.admin:
    description: Allows /clauac debug, reload and status, and everything clauac.alerts allows
    default: op
    children:
      clauac.alerts: true
  clauac.alerts:
    description: Allows /clauac alerts, which shows when a player fails a check
    default: op
